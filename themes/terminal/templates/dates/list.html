{% extends "base.html" %}

{% block title %}Archive by Date | {{ config.title }}{% endblock %}

{% block content %}
<h1 style="color: var(--accent-cyan); margin-bottom: 2rem;"># Archive by Date</h1>

<!-- Histogram -->
<div id="histogram" style="margin-bottom: 3rem;"></div>

<!-- Date links -->
<div class="tags">
{% for term in terms | sort(attribute="name") | reverse %}
    <a href="{{ term.permalink }}" class="tag">
        {{ term.name }} ({{ term.pages | length }})
    </a>
{% endfor %}
</div>

<style>
.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}
</style>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// Get all date terms data
const dateTerms = [
{% for term in terms | sort(attribute="name") | reverse %}
    {
        name: "{{ term.name }}",
        count: {{ term.pages | length }},
        pages: [
        {% for page in term.pages %}
            {
                tags: [{% for tag in page.taxonomies.tags %}"{{ tag }}"{% if not loop.last %},{% endif %}{% endfor %}]
            }{% if not loop.last %},{% endif %}
        {% endfor %}
        ]
    }{% if not loop.last %},{% endif %}
{% endfor %}
];

// Define tag colors (using terminal theme colors)
const tagColors = {
    'tech': '#7ee787',
    'kubernetes': '#79c0ff',
    'security': '#ffa657',
    'nix': '#a3be8c',
    'programming': '#7ee787',
    'food': '#ebcb8b',
    'other': '#8b949e'
};

// Count posts by tag for each month
const topTags = ['tech', 'kubernetes', 'security', 'nix', 'programming'];

// Process data for D3
const chartData = dateTerms.map(term => {
    const tagCounts = {};
    topTags.forEach(tag => tagCounts[tag] = 0);
    tagCounts.other = 0;

    // Count tags in this month
    term.pages.forEach(page => {
        let foundTag = false;
        page.tags.forEach(tag => {
            if (topTags.includes(tag)) {
                tagCounts[tag]++;
                foundTag = true;
            }
        });
        if (!foundTag) {
            tagCounts.other++;
        }
    });

    // Format month label (e.g., "25-Feb")
    const [year, month] = term.name.split('-');
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const label = `${year.slice(2)}-${monthNames[parseInt(month) - 1]}`;

    return {
        month: label,
        total: term.count,
        ...tagCounts
    };
});

// Set up dimensions
const margin = {top: 20, right: 30, bottom: 40, left: 60};
const width = 800 - margin.left - margin.right;
const height = chartData.length * 30;

// Create SVG
const svg = d3.select("#histogram")
    .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Create scales
const x = d3.scaleLinear()
    .domain([0, d3.max(chartData, d => d.total)])
    .range([0, width]);

const y = d3.scaleBand()
    .domain(chartData.map(d => d.month))
    .range([0, height])
    .padding(0.2);

// Stack the data
const stack = d3.stack()
    .keys([...topTags, 'other']);

const stackedData = stack(chartData);

// Draw bars
svg.selectAll("g.layer")
    .data(stackedData)
    .enter()
    .append("g")
    .attr("class", "layer")
    .attr("fill", d => tagColors[d.key])
    .selectAll("rect")
    .data(d => d)
    .enter()
    .append("rect")
    .attr("y", d => y(d.data.month))
    .attr("x", d => x(d[0]))
    .attr("width", d => x(d[1]) - x(d[0]))
    .attr("height", y.bandwidth())
    .append("title")
    .text((d, i, nodes) => {
        const key = d3.select(nodes[i].parentNode.parentNode).datum().key;
        const count = d.data[key];
        return `${key}: ${count}`;
    });

// Add Y axis
svg.append("g")
    .call(d3.axisLeft(y))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e");

// Add X axis
svg.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x).ticks(5))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e");

// Style axis lines
svg.selectAll(".domain, .tick line")
    .style("stroke", "#30363d");
</script>
{% endblock %}
