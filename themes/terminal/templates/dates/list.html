{% extends "base.html" %}

{% block title %}Archive by Date | {{ config.title }}{% endblock %}

{% block content %}
<h1 style="color: var(--accent-cyan); margin-bottom: 2rem;"># Posts by Date</h1>

<!-- Histogram -->
<div id="histogram" style="margin-bottom: 1rem;"></div>
<div id="legend" style="margin-bottom: 3rem;"></div>

<!-- Date links -->
<div class="tags">
{% for term in terms | sort(attribute="name") | reverse %}
    <a href="{{ term.permalink }}" class="tag">
        {{ term.name }} ({{ term.pages | length }})
    </a>
{% endfor %}
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
// Get all date terms data
const dateTerms = [
{% for term in terms | sort(attribute="name") | reverse %}
    {
        name: "{{ term.name }}",
        count: {{ term.pages | length }},
        pages: [
        {% for page in term.pages %}
            {
                tags: [{% for tag in page.taxonomies.tags %}"{{ tag }}"{% if not loop.last %},{% endif %}{% endfor %}]
            }{% if not loop.last %},{% endif %}
        {% endfor %}
        ]
    }{% if not loop.last %},{% endif %}
{% endfor %}
];

// Count posts by tag for each month
const topTags = ['tech', 'kubernetes', 'security', 'nix', 'programming'];

// Map tags to CSS variables
const tagColorVars = {
    'tech': '--accent-green',
    'kubernetes': '--accent-cyan',
    'security': '--accent-yellow',
    'nix': '--accent-green',
    'programming': '--accent-cyan',
    'other': '--text-secondary'
};

// Process data for D3
const chartData = dateTerms.map(term => {
    const tagCounts = {};
    topTags.forEach(tag => tagCounts[tag] = 0);
    tagCounts.other = 0;

    // Count tags in this month
    term.pages.forEach(page => {
        let foundTag = false;
        page.tags.forEach(tag => {
            if (topTags.includes(tag)) {
                tagCounts[tag]++;
                foundTag = true;
            }
        });
        if (!foundTag) {
            tagCounts.other++;
        }
    });

    // Format month label (e.g., "25-Feb")
    const [year, month] = term.name.split('-');
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const label = `${year.slice(2)}-${monthNames[parseInt(month) - 1]}`;

    return {
        month: label,
        total: term.count,
        ...tagCounts
    };
});

// Reverse data so oldest is on left
chartData.reverse();

// Set up dimensions
const margin = {top: 20, right: 30, bottom: 60, left: 50};
const containerWidth = document.getElementById('histogram').offsetWidth;
const width = Math.min(containerWidth - margin.left - margin.right, chartData.length * 50);
const height = 300;

// Create container with scroll if needed
const container = d3.select("#histogram")
    .style("overflow-x", "auto")
    .style("max-width", "100%");

// Create SVG
const svg = container
    .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Create scales
const x = d3.scaleBand()
    .domain(chartData.map(d => d.month))
    .range([0, width])
    .padding(0.2);

const y = d3.scaleLinear()
    .domain([0, d3.max(chartData, d => d.total)])
    .range([height, 0])
    .nice();

// Stack the data
const stack = d3.stack()
    .keys([...topTags, 'other']);

const stackedData = stack(chartData);

// Draw stacked bars with theme colors
svg.selectAll("g.layer")
    .data(stackedData)
    .enter()
    .append("g")
    .attr("class", "layer")
    .style("fill", d => `var(${tagColorVars[d.key]})`)
    .selectAll("rect")
    .data(d => d)
    .enter()
    .append("rect")
    .attr("x", d => x(d.data.month))
    .attr("y", d => y(d[1]))
    .attr("height", d => y(d[0]) - y(d[1]))
    .attr("width", x.bandwidth())
    .append("title")
    .text((d, i, nodes) => {
        const key = d3.select(nodes[i].parentNode.parentNode).datum().key;
        const count = d.data[key];
        return `${key}: ${count}`;
    });

// Add X axis
svg.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e")
    .attr("transform", "rotate(-45)")
    .style("text-anchor", "end");

// Add Y axis
svg.append("g")
    .call(d3.axisLeft(y).ticks(5))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e");

// Style axis lines
svg.selectAll(".domain, .tick line")
    .style("stroke", "#30363d");

// Add legend
const legend = d3.select("#legend")
    .append("div")
    .style("display", "flex")
    .style("flex-wrap", "wrap")
    .style("gap", "1rem")
    .style("justify-content", "center")
    .style("font-size", "0.9rem");

[...topTags, 'other'].forEach(tag => {
    const item = legend.append("div")
        .style("display", "flex")
        .style("align-items", "center")
        .style("gap", "0.5rem");

    item.append("div")
        .style("width", "16px")
        .style("height", "16px")
        .style("background-color", `var(${tagColorVars[tag]})`)
        .style("border", "1px solid #30363d");

    item.append("span")
        .style("color", "#8b949e")
        .text(tag);
});
}); // End DOMContentLoaded
</script>
{% endblock %}
