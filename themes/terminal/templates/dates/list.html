{% extends "base.html" %}

{% block title %}Archive by Date | {{ config.title }}{% endblock %}

{% block content %}
<h1 style="color: var(--accent-cyan); margin-bottom: 2rem;"># Posts by Date</h1>

<!-- Histogram -->
<div id="histogram" style="margin-bottom: 1rem;"></div>
<div id="legend" style="margin-bottom: 3rem;"></div>

<!-- Date links -->
<div class="tags">
{% for term in terms | sort(attribute="name") | reverse %}
    <a href="{{ term.permalink }}" class="tag">
        {{ term.name }} ({{ term.pages | length }})
    </a>
{% endfor %}
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
// Get all date terms data
const dateTerms = [
{% for term in terms | sort(attribute="name") | reverse %}
    {
        name: "{{ term.name }}",
        count: {{ term.pages | length }},
        pages: [
        {% for page in term.pages %}
            {
                tags: [{% for tag in page.taxonomies.tags %}"{{ tag }}"{% if not loop.last %},{% endif %}{% endfor %}]
            }{% if not loop.last %},{% endif %}
        {% endfor %}
        ]
    }{% if not loop.last %},{% endif %}
{% endfor %}
];

// Count posts by tag for each month
const topTags = ['tech', 'kubernetes', 'security', 'nix', 'programming'];

// Map tags to CSS variables
const tagColorVars = {
    'tech': '--accent-green',
    'kubernetes': '--accent-cyan',
    'security': '--accent-yellow',
    'nix': '--accent-green',
    'programming': '--accent-cyan',
    'other': '--text-secondary'
};

// Process data for D3
const chartData = dateTerms.map(term => {
    const tagCounts = {};
    topTags.forEach(tag => tagCounts[tag] = 0);
    tagCounts.other = 0;

    // Count tags in this month
    term.pages.forEach(page => {
        let foundTag = false;
        page.tags.forEach(tag => {
            if (topTags.includes(tag)) {
                tagCounts[tag]++;
                foundTag = true;
            }
        });
        if (!foundTag) {
            tagCounts.other++;
        }
    });

    // Format month label (e.g., "25-Feb")
    const [year, month] = term.name.split('-');
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const label = `${year.slice(2)}-${monthNames[parseInt(month) - 1]}`;

    return {
        month: label,
        total: term.count,
        ...tagCounts
    };
});

// Reverse data so oldest is on left
chartData.reverse();

// Set up dimensions
const margin = {top: 20, right: 30, bottom: 60, left: 50};
const containerWidth = document.getElementById('histogram').offsetWidth;
const width = Math.min(containerWidth - margin.left - margin.right, chartData.length * 50);
const height = 300;

// Create container with scroll if needed
const container = d3.select("#histogram")
    .style("overflow-x", "auto")
    .style("max-width", "100%");

// Create SVG
const svg = container
    .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
    .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// Create scales
const x = d3.scaleBand()
    .domain(chartData.map(d => d.month))
    .range([0, width])
    .padding(0.2);

const y = d3.scaleLinear()
    .domain([0, d3.max(chartData, d => d.total)])
    .range([height, 0])
    .nice();

// Track visibility state
const visibleTags = new Set([...topTags, 'other']);

// Function to update the chart
function updateChart() {
    // Get visible keys only
    const visibleKeys = [...topTags, 'other'].filter(tag => visibleTags.has(tag));

    // Stack the data with visible keys
    const stack = d3.stack()
        .keys(visibleKeys);

    const stackedData = stack(chartData);

    // Update Y scale domain based on visible data
    const maxValue = d3.max(chartData, d => {
        return visibleKeys.reduce((sum, key) => sum + d[key], 0);
    });
    y.domain([0, maxValue]).nice();

    // Update Y axis
    svg.select(".y-axis")
        .transition()
        .duration(300)
        .call(d3.axisLeft(y).ticks(5));

    // Bind data to layers
    const layers = svg.selectAll("g.layer")
        .data(stackedData, d => d.key);

    // Remove layers for hidden tags
    layers.exit()
        .transition()
        .duration(300)
        .style("opacity", 0)
        .remove();

    // Add new layers for newly visible tags
    const newLayers = layers.enter()
        .append("g")
        .attr("class", "layer")
        .style("fill", d => `var(${tagColorVars[d.key]})`)
        .style("opacity", 0);

    // Merge existing and new layers
    const allLayers = newLayers.merge(layers);

    allLayers.transition()
        .duration(300)
        .style("opacity", 1);

    // Update rectangles in each layer
    allLayers.each(function(layerData) {
        const rects = d3.select(this).selectAll("rect")
            .data(layerData, (d, i) => i);

        // Remove old rects
        rects.exit().remove();

        // Add new rects
        const newRects = rects.enter()
            .append("rect")
            .attr("x", d => x(d.data.month))
            .attr("y", y(0))
            .attr("height", 0)
            .attr("width", x.bandwidth());

        newRects.append("title");

        // Update all rects
        newRects.merge(rects)
            .transition()
            .duration(300)
            .attr("x", d => x(d.data.month))
            .attr("y", d => y(d[1]))
            .attr("height", d => y(d[0]) - y(d[1]))
            .attr("width", x.bandwidth());

        newRects.merge(rects).select("title")
            .text(d => {
                const key = d3.select(d3.select(this).node().parentNode).datum().key;
                const count = d.data[key];
                return `${key}: ${count}`;
            });
    });
}

// Initial chart render
updateChart();

// Add X axis
svg.append("g")
    .attr("transform", `translate(0,${height})`)
    .call(d3.axisBottom(x))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e")
    .attr("transform", "rotate(-45)")
    .style("text-anchor", "end");

// Add Y axis
svg.append("g")
    .call(d3.axisLeft(y).ticks(5))
    .style("color", "#8b949e")
    .selectAll("text")
    .style("fill", "#8b949e");

// Style axis lines
svg.selectAll(".domain, .tick line")
    .style("stroke", "#30363d");

// Track visibility state
const visibleTags = new Set([...topTags, 'other']);

// Add legend with click handlers
const legend = d3.select("#legend")
    .append("div")
    .style("display", "flex")
    .style("flex-wrap", "wrap")
    .style("gap", "1rem")
    .style("justify-content", "center")
    .style("font-size", "0.9rem");

[...topTags, 'other'].forEach(tag => {
    const item = legend.append("div")
        .style("display", "flex")
        .style("align-items", "center")
        .style("gap", "0.5rem")
        .style("cursor", "pointer")
        .style("opacity", "1")
        .attr("data-tag", tag)
        .on("click", function() {
            // Toggle visibility
            if (visibleTags.has(tag)) {
                visibleTags.delete(tag);
                d3.select(this).style("opacity", "0.3");
            } else {
                visibleTags.add(tag);
                d3.select(this).style("opacity", "1");
            }

            // Update chart
            svg.selectAll("g.layer")
                .style("opacity", d => visibleTags.has(d.key) ? 1 : 0);
        });

    item.append("div")
        .style("width", "16px")
        .style("height", "16px")
        .style("background-color", `var(${tagColorVars[tag]})`)
        .style("border", "1px solid #30363d");

    item.append("span")
        .style("color", "#8b949e")
        .text(tag);
});
}); // End DOMContentLoaded
</script>
{% endblock %}
