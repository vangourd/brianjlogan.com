{% extends "base.html" %}

{% block title %}Tags | {{ config.title }}{% endblock %}

{% block content %}
<h1 style="color: var(--accent-cyan); margin-bottom: 2rem;"># All Tags</h1>

<div class="tags">
{% for term in terms %}
    <a href="{{ term.permalink }}" class="tag">
        {{ term.name }} ({{ term.pages | length }})
    </a>
{% endfor %}
</div>

<div style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border-color);">
    <h2 style="color: var(--accent-green); margin-bottom: 1rem;"># Browse by Date</h2>
    <p style="color: var(--text-secondary); margin-bottom: 1rem;">View posts organized by month and year</p>
    <a href="{{ get_url(path='/dates/') }}" style="color: var(--accent-cyan); font-weight: 600;">→ Archive by Date</a>
</div>
{% endblock %}
