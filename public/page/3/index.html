<script>
window.addEventListener('DOMContentLoaded', (event) => {
    const search = document.getElementById('search');
    const postItems = document.querySelectorAll('.post-item');

    if (search && window.searchIndex) {
        search.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();

            if (query.length === 0) {
                postItems.forEach(item => item.style.display = 'block');
                return;
            }

            postItems.forEach(item => {
                const title = item.querySelector('.post-title a').textContent.toLowerCase();
                const summary = item.querySelector('.post-summary')?.textContent.toLowerCase() || '';

                if (title.includes(query) || summary.includes(query)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });
    }
});
</script>
