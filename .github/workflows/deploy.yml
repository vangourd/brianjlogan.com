name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: brianjlogan
      CF_DIST: E1M4PHQ22RRP56
      AWS_REGION: us-east-2
    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Build Zola site
          uses: shalzz/zola-deploy-action@v0.20.0
          env:
              BUILD_DIR: .
              BUILD_ONLY: true

        - name: Deploy to S3
          run: |
            aws s3 sync public/ s3://${S3_BUCKET}/ --delete --region ${AWS_REGION}
            aws cloudfront create-invalidation --distribution-id ${CF_DIST} --paths "/*"

        - name: Verify deployment
          run: |
            echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **S3 Bucket**: ${S3_BUCKET}" >> $GITHUB_STEP_SUMMARY
            echo "- **Region**: ${AWS_REGION}" >> $GITHUB_STEP_SUMMARY
            echo "- **Files deployed from**: public/" >> $GITHUB_STEP_SUMMARY
            echo "- **Cache invalidated**: /*" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "Verifying S3 bucket contents..."
            aws s3 ls s3://${S3_BUCKET}/ --region ${AWS_REGION} || echo "Failed to list bucket contents"
            echo ""
            echo "Checking index.html..."
            aws s3api head-object --bucket ${S3_BUCKET} --key index.html --region ${AWS_REGION} || echo "index.html not found"
            echo ""
            echo "CloudFront invalidation status..."
            aws cloudfront list-invalidations --distribution-id ${CF_DIST} --max-items 1 || echo "Failed to check invalidations"
            echo ""
            echo "Deployment verification complete!"
